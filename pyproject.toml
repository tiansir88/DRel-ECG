[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drel-ecg"
version = "0.2.0"
description = "Reference implementation of DRel-ECG and Graph-Informed Hard Negative Modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.26,<3",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "PyYAML>=6.0",
  "wfdb>=4.1",
]

[tool.setuptools.packages.find]
include = ["drel_ecg*", "mcki_ecg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
